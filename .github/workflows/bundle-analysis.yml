name: 📦 번들 분석

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR 번호 (선택사항)'
        required: false
        type: string

concurrency:
  group: bundle-analysis-${{ (github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number) || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 📦 번들 크기 분석
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with: { version: 9 }

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📂 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 CI 빌드 결과 다운로드
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = process.env.WORKFLOW_RUN_ID;
            if (!runId) {
              core.info('No WORKFLOW_RUN_ID found (not a workflow_run event).');
            } else {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(runId),
              });

              const buildArtifact = artifacts.data.artifacts.find(a => a.name === 'build-outputs');

              const fs = require('fs');
              const cp = require('child_process');

              if (buildArtifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: buildArtifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('build-outputs.zip', Buffer.from(download.data));
                cp.execSync('unzip -q build-outputs.zip && rm build-outputs.zip');
              }
            }

      - name: 📊 번들 분석 빌드
        run: |
          cd apps/web

          if [ -d ".next" ]; then
            echo "♻️ CI 빌드 결과 재사용"
          else
            echo "🔄 프로덕션 빌드 (번들 분석 활성화)"
          fi

          ANALYZE=true pnpm build
          echo "✅ 번들 분석 완료"

      - name: 📈 번들 사이즈 분석
        id: bundle-analysis
        run: |
          cd apps/web

          if [ -d ".next/static" ]; then
            BUNDLE_SIZE=$(du -sh .next/static 2>/dev/null | cut -f1 || echo "알 수 없음")
            JS_SIZE=$(find .next/static -name "*.js" -exec du -ch {} + 2>/dev/null | grep total | cut -f1 || echo "알 수 없음")
            JS_COUNT=$(find .next/static -name "*.js" 2>/dev/null | wc -l || echo "0")

            echo "BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$JS_SIZE" >> $GITHUB_OUTPUT
            echo "JS_COUNT=$JS_COUNT" >> $GITHUB_OUTPUT

            # 주요 청크 정보 (크기순 정렬)
            {
              echo "MAIN_CHUNKS<<EOF"
              find .next/static/chunks -name "*.js" -exec ls -lh {} \; 2>/dev/null | sort -k5 -rh | head -10 | awk '{print $9 " - " $5}' | sed 's|.*/||' || echo "청크 정보를 가져올 수 없습니다"
              echo "EOF"
            } >> $GITHUB_OUTPUT

            echo "✅ 번들 분석 완료"
          else
            echo "⚠️ .next/static 폴더가 없습니다. 기본값 설정"
            echo "BUNDLE_SIZE=알 수 없음" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=알 수 없음" >> $GITHUB_OUTPUT
            echo "JS_COUNT=0" >> $GITHUB_OUTPUT
            {
              echo "MAIN_CHUNKS<<EOF"
              echo "빌드 결과가 없어 청크 정보를 확인할 수 없습니다"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: 🎯 번들 최적화 권장사항
        id: bundle-recommendations
        run: |
          if node .github/scripts/bundle-diff.js >> $GITHUB_OUTPUT; then
            echo "✅ 번들 최적화 분석 완료"
          else
            echo "⚠️ 번들 최적화 분석 실패 - 기본값 설정"
            {
              echo "BUNDLE_RECOMMENDATIONS<<EOF"
              echo "### 📦 번들 분석 결과"
              echo ""
              echo "번들 분석을 수행할 수 없습니다. 빌드가 정상적으로 완료되었는지 확인해주세요."
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: 💬 PR에 번들 분석 코멘트 작성
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;

            if (context.payload.workflow_run && context.payload.workflow_run.pull_requests && context.payload.workflow_run.pull_requests[0]) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            } else if (context.payload.inputs && context.payload.inputs.pr_number) {
              prNumber = context.payload.inputs.pr_number;
            }

            if (!prNumber) {
              console.log('PR 번호를 찾을 수 없습니다. 코멘트를 생성하지 않습니다.');
              return;
            }

            const bundleSize = '${{ steps.bundle-analysis.outputs.BUNDLE_SIZE }}';
            const jsSize = '${{ steps.bundle-analysis.outputs.TOTAL_JS_SIZE }}';
            const jsCount = '${{ steps.bundle-analysis.outputs.JS_COUNT }}';
            const mainChunks = `${{ steps.bundle-analysis.outputs.MAIN_CHUNKS }}`;
            const recommendations = `${{ steps.bundle-recommendations.outputs.BUNDLE_RECOMMENDATIONS }}`;

            let comment = "## 📦 번들 분석 결과\n\n";
            comment += "### 📊 번들 크기 요약\n";
            comment += "| 항목 | 값 |\n";
            comment += "|------|-----|\n";
            comment += `| 📦 전체 번들 크기 | \`${bundleSize}\` |\n`;
            comment += `| 📄 JavaScript 크기 | \`${jsSize}\` |\n`;
            comment += `| 🗂️ JavaScript 파일 수 | \`${jsCount}개\` |\n\n`;
            comment += "### 🔍 주요 청크 파일 (크기순)\n";
            comment += "```\n";
            comment += mainChunks;
            comment += "\n```\n\n";
            comment += recommendations;
            comment += "\n\n---\n";
            comment += "🤖 자동 생성된 번들 분석 리포트";

            // 기존 번들 분석 코멘트 찾기
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('📦 번들 분석 결과')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
              console.log('기존 번들 분석 코멘트를 업데이트했습니다.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              console.log('새로운 번들 분석 코멘트를 생성했습니다.');
            }

      - name: 📤 번들 분석 결과 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-${{ (github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number) || github.event.inputs.pr_number || github.run_id }}
          path: |
            apps/web/.next/analyze/
          retention-days: 7
