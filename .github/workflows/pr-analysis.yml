name: 📊 PR 분석 및 리포트

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-analysis-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔍 번들 분석 및 성능 측정
    runs-on: ubuntu-latest
    # CI 성공 시에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with: { version: 9 }

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📂 Install dependencies (분석 도구만)
        run: pnpm install --frozen-lockfile

      - name: 📥 CI 빌드 결과 다운로드
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            const buildArtifact = artifacts.data.artifacts.find(function(artifact) { return artifact.name === 'build-outputs'; });
            const coverageArtifact = artifacts.data.artifacts.find(function(artifact) { return artifact.name === 'coverage-reports'; });

            if (buildArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: buildArtifact.id,
                archive_format: 'zip',
              });

              const fs = require('fs');
              fs.writeFileSync('build-outputs.zip', Buffer.from(download.data));

              const childProcess = require('child_process');
              childProcess.execSync('unzip -q build-outputs.zip && rm build-outputs.zip');
            }

            if (coverageArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: coverageArtifact.id,
                archive_format: 'zip',
              });

              const fs = require('fs');
              fs.writeFileSync('coverage-reports.zip', Buffer.from(download.data));

              const childProcess = require('child_process');
              childProcess.execSync('unzip -q coverage-reports.zip && rm coverage-reports.zip');
            }

      - name: 📥 직접 실행 시 아티팩트 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: ./
        continue-on-error: true

      - name: 📥 직접 실행 시 커버리지 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: ./
        continue-on-error: true

      - name: 📊 번들 분석 리포트 생성 (두 가지 빌드)
        run: |
          cd apps/web

          echo "🔄 1단계: 일반 빌드 (코드 스플리팅 활성화)"
          ANALYZE=true pnpm build

          # 일반 빌드 결과 백업
          if [ -d ".next" ]; then
            cp -r .next .next-split
            echo "✅ 코드 스플리팅 빌드 완료"
          fi

          echo "🔄 2단계: 통합 빌드 (코드 스플리팅 비활성화)"
          pnpm build:analyze-no-split

          # 통합 빌드 결과 백업
          if [ -d ".next" ]; then
            cp -r .next .next-unified
            echo "✅ 통합 빌드 완료"
          fi

          echo "📊 두 가지 빌드 분석 준비 완료"

      - name: 📈 번들 사이즈 리포트 생성 (비교 분석)
        id: bundle-analysis
        run: |
          cd apps/web

          # 1. 코드 스플리팅 빌드 분석
          if [ -d ".next-split/static" ]; then
            SPLIT_BUNDLE_SIZE=$(du -sh .next-split/static | cut -f1)
            SPLIT_JS_SIZE=$(find .next-split/static -name "*.js" -exec du -ch {} + | grep total | cut -f1)
            SPLIT_JS_COUNT=$(find .next-split/static -name "*.js" | wc -l)

            echo "SPLIT_BUNDLE_SIZE=$SPLIT_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "SPLIT_JS_SIZE=$SPLIT_JS_SIZE" >> $GITHUB_OUTPUT
            echo "SPLIT_JS_COUNT=$SPLIT_JS_COUNT" >> $GITHUB_OUTPUT

            # 주요 청크 정보 추출
            echo "SPLIT_CHUNKS<<EOF" >> $GITHUB_OUTPUT
            find .next-split/static/chunks -name "*.js" -exec ls -lh {} \; 2>/dev/null | head -8 | awk '{print $9 " - " $5}' | sed 's|.*/||' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "✅ 코드 스플리팅 빌드 분석 완료"
          fi

          # 2. 통합 빌드 분석
          if [ -d ".next-unified/static" ]; then
            UNIFIED_BUNDLE_SIZE=$(du -sh .next-unified/static | cut -f1)
            UNIFIED_JS_SIZE=$(find .next-unified/static -name "*.js" -exec du -ch {} + | grep total | cut -f1)
            UNIFIED_JS_COUNT=$(find .next-unified/static -name "*.js" | wc -l)

            echo "UNIFIED_BUNDLE_SIZE=$UNIFIED_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "UNIFIED_JS_SIZE=$UNIFIED_JS_SIZE" >> $GITHUB_OUTPUT
            echo "UNIFIED_JS_COUNT=$UNIFIED_JS_COUNT" >> $GITHUB_OUTPUT

            # 통합 번들 파일 정보
            echo "UNIFIED_FILES<<EOF" >> $GITHUB_OUTPUT
            find .next-unified/static -name "*.js" -exec ls -lh {} \; 2>/dev/null | awk '{print $9 " - " $5}' | sed 's|.*/||' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "✅ 통합 빌드 분석 완료"
          fi

          # 기본값 설정 (호환성을 위해)
          if [ -d ".next-split/static" ]; then
            echo "BUNDLE_SIZE=$SPLIT_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$SPLIT_JS_SIZE" >> $GITHUB_OUTPUT
          elif [ -d ".next-unified/static" ]; then
            echo "BUNDLE_SIZE=$UNIFIED_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$UNIFIED_JS_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 테스트 결과 상세 분석
        id: test-analysis
        run: |
          # 테스트 분석 스크립트 실행
          cd apps/web
          if [ -f "coverage/coverage-summary.json" ]; then
            node ../../.github/scripts/analyze-test-results.js >> $GITHUB_OUTPUT
          fi

      - name: 🎯 번들 최적화 권장사항 분석
        id: bundle-recommendations
        run: |
          node .github/scripts/bundle-diff.js >> $GITHUB_OUTPUT

      - name: ⚡ Lighthouse 성능 측정 (샘플)
        id: lighthouse
        continue-on-error: true
        run: |
          # 간단한 Lighthouse 점수 시뮬레이션 (실제 배포 URL이 필요)
          echo "LIGHTHOUSE_PERFORMANCE=85" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_ACCESSIBILITY=92" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_BEST_PRACTICES=88" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_SEO=90" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_STATUS=simulated" >> $GITHUB_OUTPUT

          # 실제 프로덕션에서는 아래와 같이 사용:
          # npm install -g @lhci/cli
          # lhci autorun --collect.url=https://your-deployed-pr-url.vercel.app

      - name: 💬 PR 댓글 생성
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // PR 번호 확인
            let prNumber;
            if (context.issue && context.issue.number) {
              prNumber = context.issue.number;
            } else if (context.payload.workflow_run && context.payload.workflow_run.pull_requests[0]) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            } else {
              console.log('PR 번호를 찾을 수 없습니다.');
              return;
            }

            // 기존 봇 댓글 찾기
            const commentsResponse = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const comments = commentsResponse.data;
            const botComment = comments.find(function(comment) {
              return comment.user.type === 'Bot' &&
                comment.body.includes('📊 PR 분석 리포트');
            });

            // 번들 사이즈 정보 (기본값)
            const bundleSize = '${{ steps.bundle-analysis.outputs.BUNDLE_SIZE }}' || '정보 없음';
            const totalJsSize = '${{ steps.bundle-analysis.outputs.TOTAL_JS_SIZE }}' || '정보 없음';

            // 코드 스플리팅 빌드 정보
            const splitBundleSize = '${{ steps.bundle-analysis.outputs.SPLIT_BUNDLE_SIZE }}' || '정보 없음';
            const splitJsSize = '${{ steps.bundle-analysis.outputs.SPLIT_JS_SIZE }}' || '정보 없음';
            const splitJsCount = '${{ steps.bundle-analysis.outputs.SPLIT_JS_COUNT }}' || '0';
            const splitChunks = `${{ steps.bundle-analysis.outputs.SPLIT_CHUNKS }}` || '';

            // 통합 빌드 정보
            const unifiedBundleSize = '${{ steps.bundle-analysis.outputs.UNIFIED_BUNDLE_SIZE }}' || '정보 없음';
            const unifiedJsSize = '${{ steps.bundle-analysis.outputs.UNIFIED_JS_SIZE }}' || '정보 없음';
            const unifiedJsCount = '${{ steps.bundle-analysis.outputs.UNIFIED_JS_COUNT }}' || '0';
            const unifiedFiles = `${{ steps.bundle-analysis.outputs.UNIFIED_FILES }}` || '';

            // 테스트 정보 (상세 분석 결과 사용)
            const testMarkdown = `${{ steps.test-analysis.outputs.TEST_ANALYSIS_MARKDOWN }}` || '테스트 정보 없음';
            const testSuccessRate = '${{ steps.test-analysis.outputs.TEST_SUCCESS_RATE }}' || '0';
            const coverageLines = '${{ steps.test-analysis.outputs.COVERAGE_LINES }}' || '0';

            // 번들 권장사항
            const bundleRecommendations = `${{ steps.bundle-recommendations.outputs.BUNDLE_RECOMMENDATIONS }}` || '';

            // Lighthouse 점수
            const lighthousePerf = '${{ steps.lighthouse.outputs.LIGHTHOUSE_PERFORMANCE }}' || '0';
            const lighthouseA11y = '${{ steps.lighthouse.outputs.LIGHTHOUSE_ACCESSIBILITY }}' || '0';
            const lighthouseBP = '${{ steps.lighthouse.outputs.LIGHTHOUSE_BEST_PRACTICES }}' || '0';
            const lighthouseSEO = '${{ steps.lighthouse.outputs.LIGHTHOUSE_SEO }}' || '0';
            const lighthouseStatus = '${{ steps.lighthouse.outputs.LIGHTHOUSE_STATUS }}' || 'unavailable';

            // 성능 점수 계산 함수 (개선된 버전)
            function calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf) {
              // 가중치 설정
              const weights = {
                test: 0.25,      // 테스트 성공률 25%
                coverage: 0.25,  // 코드 커버리지 25%
                bundle: 0.25,    // 번들 크기 25%
                lighthouse: 0.25 // Lighthouse 성능 25%
              };

              // 각 점수 계산
              const testScore = Math.min(parseFloat(testSuccessRate) || 0, 100) * weights.test;
              const coverageScore = Math.min(parseFloat(coverageLines) || 0, 100) * weights.coverage;

              // 번들 크기 점수 (개선된 계산)
              let bundleScore = 25; // 기본 점수
              if (bundleSize.includes('K')) {
                bundleScore = 25; // KB 단위는 매우 좋음
              } else if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 0.5) bundleScore = 25;
                else if (sizeMB < 1) bundleScore = 22;
                else if (sizeMB < 2) bundleScore = 18;
                else if (sizeMB < 3) bundleScore = 15;
                else if (sizeMB < 5) bundleScore = 10;
                else bundleScore = 5;
              }
              bundleScore *= weights.bundle;

              // Lighthouse 성능 점수
              const lighthouseScore = (parseFloat(lighthousePerf) || 0) * weights.lighthouse;

              const totalScore = Math.round(testScore + coverageScore + bundleScore + lighthouseScore);

              let grade, emoji;
              if (totalScore >= 90) { grade = 'A+'; emoji = '🏆'; }
              else if (totalScore >= 80) { grade = 'A'; emoji = '🥇'; }
              else if (totalScore >= 70) { grade = 'B'; emoji = '🥈'; }
              else if (totalScore >= 60) { grade = 'C'; emoji = '🥉'; }
              else { grade = 'D'; emoji = '⚠️'; }

              return {
                score: totalScore,
                grade,
                emoji,
                breakdown: {
                  test: Math.round(testScore),
                  coverage: Math.round(coverageScore),
                  bundle: Math.round(bundleScore),
                  lighthouse: Math.round(lighthouseScore)
                }
              };
            }

            function getBundleSizeScore(bundleSize) {
              if (bundleSize.includes('K')) return '🟢 매우 좋음';
              if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 1) return '🟢 좋음';
                if (sizeMB < 2) return '🟡 보통';
                if (sizeMB < 5) return '🟠 주의';
                return '🔴 개선 필요';
              }
              return '🔍 분석 중';
            }

            function getLighthouseStatus(score) {
              const num = parseFloat(score) || 0;
              if (num >= 90) return '🟢 우수';
              if (num >= 75) return '🟡 양호';
              if (num >= 50) return '🟠 보통';
              return '🔴 개선 필요';
            }

            const performanceScore = calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf);

            // 댓글 내용 생성
            const commentBody = `## 📊 PR 분석 리포트

            ### 🎯 번들 사이즈 분석

            | 빌드 유형 | 정적 파일 | JavaScript | 파일 수 | 특징 |
            |-----------|-----------|------------|---------|------|
            | 🧩 **코드 스플리팅** | \`${splitBundleSize}\` | \`${splitJsSize}\` | ${splitJsCount}개 | 페이지별 분리, 캐싱 최적화 |
            | 📦 **통합 번들** | \`${unifiedBundleSize}\` | \`${unifiedJsSize}\` | ${unifiedJsCount}개 | 전체 크기 확인, 단순한 구조 |

            <details>
            <summary>🧩 코드 스플리팅 상세 (권장 방식)</summary>

            **주요 청크 파일들:**
            \`\`\`
            ${splitChunks || '청크 정보 없음'}
            \`\`\`

            **장점:**
            - ⚡ 초기 로딩 속도 향상 (필요한 청크만 로드)
            - 🔄 효율적인 캐싱 (변경되지 않은 청크 재사용)
            - 📱 모바일 친화적 (작은 초기 번들)

            </details>

            <details>
            <summary>📦 통합 번들 상세 (분석용)</summary>

            **생성된 파일들:**
            \`\`\`
            ${unifiedFiles || '파일 정보 없음'}
            \`\`\`

            **용도:**
            - 🔍 전체 앱 크기 한눈에 파악
            - 📊 라이브러리 의존성 분석
            - 🎯 최적화 대상 식별

            </details>

            ${testMarkdown}

            ${bundleRecommendations}

            ### ⚡ Lighthouse 성능 지표

            ${lighthouseStatus === 'simulated' ? '🔬 **시뮬레이션 점수** (실제 배포 시 정확한 측정)' : '🌐 **실제 측정 점수**'}

            | 지표 | 점수 | 상태 |
            |------|------|------|
            | 🚀 Performance | ${lighthousePerf}점 | ${getLighthouseStatus(lighthousePerf)} |
            | ♿ Accessibility | ${lighthouseA11y}점 | ${getLighthouseStatus(lighthouseA11y)} |
            | ✅ Best Practices | ${lighthouseBP}점 | ${getLighthouseStatus(lighthouseBP)} |
            | 🔍 SEO | ${lighthouseSEO}점 | ${getLighthouseStatus(lighthouseSEO)} |

            ### 🏆 전체 품질 점수

            ${performanceScore.emoji} **${performanceScore.score}/100** (${performanceScore.grade})

            <details>
            <summary>📊 점수 구성 상세</summary>

            **가중치 기준 (각 25%):**
            - 🧪 테스트 성공률: ${testSuccessRate}% → **${performanceScore.breakdown.test}점**
            - 🎯 코드 커버리지: ${coverageLines}% → **${performanceScore.breakdown.coverage}점**
            - 📦 번들 최적화: ${getBundleSizeScore(bundleSize)} → **${performanceScore.breakdown.bundle}점**
            - ⚡ Lighthouse 성능: ${lighthousePerf}점 → **${performanceScore.breakdown.lighthouse}점**

            **등급 기준:**
            - 🏆 A+ (90점 이상): 매우 우수
            - 🥇 A (80-89점): 우수
            - 🥈 B (70-79점): 양호
            - 🥉 C (60-69점): 보통
            - ⚠️ D (60점 미만): 개선 필요

            </details>

            <details>
            <summary>📈 상세 분석 리포트</summary>

            - **번들 분석**: [상세보기](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})
            - **테스트 커버리지**: [HTML 리포트](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})
            - **빌드 로그**: [전체 로그](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})

            </details>

            ### 🔗 유용한 링크

            - 📊 [번들 분석 상세보기](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})
            - 🧪 [테스트 커버리지 리포트](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})
            - 🏗️ [빌드 로그](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})

            ---

            > 🤖 이 리포트는 PR이 업데이트될 때마다 자동으로 갱신됩니다.
            > 📅 마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;

            if (botComment) {
              // 기존 댓글 업데이트
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // 새 댓글 생성
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

      - name: 📤 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports
          path: |
            apps/web/coverage/
            apps/web/.next/analyze/
          retention-days: 7
