name: 📊 PR 분석 및 리포트

on:
  workflow_run:
    workflows: ['CI', 'Preview']
    types: [completed]
  pull_request:
    types: [opened, synchronize]

concurrency:
  # CHANGED: 안전한 그룹 키 (PR 번호 or workflow_run의 PR 번호 or run_id)
  group: pr-analysis-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔍 번들 분석 및 성능 측정
    runs-on: ubuntu-latest
    # CI 성공 시에만 실행 (PR 직접 실행도 허용)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with: { version: 9 }

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📂 Install dependencies (분석 도구만)
        run: pnpm install --frozen-lockfile

      - name: 📥 CI 빌드 결과 다운로드
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = process.env.WORKFLOW_RUN_ID;
            if (!runId) {
              core.info('No WORKFLOW_RUN_ID found (not a workflow_run event).');
            } else {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(runId),
              });

              const buildArtifact = artifacts.data.artifacts.find(a => a.name === 'build-outputs');
              const coverageArtifact = artifacts.data.artifacts.find(a => a.name === 'coverage-reports');

              const fs = require('fs');
              const cp = require('child_process');

              if (buildArtifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: buildArtifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('build-outputs.zip', Buffer.from(download.data));
                cp.execSync('unzip -q build-outputs.zip && rm build-outputs.zip');
              }

              if (coverageArtifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: coverageArtifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('coverage-reports.zip', Buffer.from(download.data));
                cp.execSync('unzip -q coverage-reports.zip && rm coverage-reports.zip');
              }
            }

      - name: 📥 직접 실행 시 아티팩트 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: ./
        continue-on-error: true

      - name: 📥 직접 실행 시 커버리지 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: ./
        continue-on-error: true

      - name: 📊 번들 분석 리포트 생성
        run: |
          cd apps/web

          echo "🔄 프로덕션 빌드 (번들 분석 활성화)"
          ANALYZE=true pnpm build

          echo "✅ 번들 분석 완료"

      - name: 📈 번들 사이즈 리포트 생성
        id: bundle-analysis
        run: |
          cd apps/web

          # 번들 분석
          if [ -d ".next/static" ]; then
            BUNDLE_SIZE=$(du -sh .next/static | cut -f1)
            JS_SIZE=$(find .next/static -name "*.js" -exec du -ch {} + | grep total | cut -f1)
            JS_COUNT=$(find .next/static -name "*.js" | wc -l)

            echo "BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$JS_SIZE" >> $GITHUB_OUTPUT
            echo "JS_COUNT=$JS_COUNT" >> $GITHUB_OUTPUT

            # 주요 청크 정보 추출 (멀티라인 출력)
            {
              echo "MAIN_CHUNKS<<EOF"
              find .next/static/chunks -name "*.js" -exec ls -lh {} \; 2>/dev/null | head -10 | awk '{print $9 " - " $5}' | sed 's|.*/||'
              echo "EOF"
            } >> $GITHUB_OUTPUT

            echo "✅ 번들 분석 완료"
          fi

      - name: 🧪 테스트 결과 상세 분석
        id: test-analysis
        run: |
          cd apps/web
          if [ -f "coverage/coverage-summary.json" ]; then
            node ../../.github/scripts/analyze-test-results.js >> $GITHUB_OUTPUT
          fi

      - name: 🎯 번들 최적화 권장사항 분석
        id: bundle-recommendations
        run: |
          node .github/scripts/bundle-diff.js >> $GITHUB_OUTPUT

      - name: 🔍 PR 변경사항 분석
        id: changed-pages
        run: |
          # PR에서 변경된 파일 목록 가져오기
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            # workflow_run의 경우 최근 커밋 비교
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "CHANGED_FILES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 변경된 페이지 감지
          CHANGED_FILES="$CHANGED_FILES" node .github/scripts/detect-changed-pages.js >> $GITHUB_OUTPUT

      - name: 🔍 Vercel Preview URL 감지
        id: preview-url
        run: |
          # Preview 워크플로우에서 생성된 댓글에서 URL 추출
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Preview" ]; then
            echo "🔍 Preview 워크플로우 완료 후 실행 - Vercel URL 확인 중..."

            # PR 번호 확인
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ ! -z "$PR_NUMBER" ]; then
              echo "📍 PR 번호: $PR_NUMBER"

              # 최근 댓글에서 Preview URL 추출
              PREVIEW_URL=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments \
                --jq '.[] | select(.body | contains("✅ PREVIEW")) | .body' \
                | grep -o 'https://[^ ]*' | head -1)

              if [ ! -z "$PREVIEW_URL" ]; then
                echo "🌐 Vercel Preview URL 발견: $PREVIEW_URL"
                echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
                echo "USE_PREVIEW=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Preview URL을 찾을 수 없습니다."
                echo "USE_PREVIEW=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "💻 직접 실행 모드 - 로컬 서버 사용"
            echo "USE_PREVIEW=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: ⚡ 페이지별 Lighthouse 성능 측정
        id: lighthouse
        continue-on-error: true
        run: |
          PREVIEW_URL="${{ steps.preview-url.outputs.PREVIEW_URL }}"
          USE_PREVIEW="${{ steps.preview-url.outputs.USE_PREVIEW }}"

          if [ "$USE_PREVIEW" = "true" ] && [ ! -z "$PREVIEW_URL" ]; then
            echo "🌐 Vercel Preview URL로 Lighthouse 측정: $PREVIEW_URL"

            # Preview URL 접근 대기
            echo "⏳ Preview 배포 완료 대기 중..."
            sleep 10

            # Preview 사이트 접근 확인
            if curl -f "$PREVIEW_URL" > /dev/null 2>&1; then
              echo "✅ Preview 사이트 접근 성공"

              # 페이지별 Lighthouse 실행 (Vercel Preview)
              CHANGED_PAGES="${{ steps.changed-pages.outputs.CHANGED_PAGES }}" \
              LIGHTHOUSE_BASE_URL="$PREVIEW_URL" \
              MAX_LIGHTHOUSE_PAGES=5 \
              node .github/scripts/lighthouse-multi-page.js >> $GITHUB_OUTPUT
            else
              echo "❌ Preview 사이트 접근 실패 - 로컬 서버로 대체"
              USE_PREVIEW="false"
            fi
          fi

          if [ "$USE_PREVIEW" != "true" ]; then
            echo "💻 로컬 서버로 Lighthouse 측정"
            cd apps/web

            # 프로덕션 서버 시작 (백그라운드)
            pnpm start &
            SERVER_PID=$!

            # 서버 시작 대기
            echo "🔄 서버 시작 대기 중..."
            sleep 15

            # 서버 상태 확인
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ 로컬 서버 정상 시작"

              # 페이지별 Lighthouse 실행 (로컬)
              CHANGED_PAGES="${{ steps.changed-pages.outputs.CHANGED_PAGES }}" \
              LIGHTHOUSE_BASE_URL="http://localhost:3000" \
              MAX_LIGHTHOUSE_PAGES=5 \
              node ../../.github/scripts/lighthouse-multi-page.js >> $GITHUB_OUTPUT
            else
              echo "❌ 로컬 서버 시작 실패 - 시뮬레이션 모드"
              echo "LIGHTHOUSE_PERFORMANCE=0" >> $GITHUB_OUTPUT
              echo "LIGHTHOUSE_ACCESSIBILITY=0" >> $GITHUB_OUTPUT
              echo "LIGHTHOUSE_BEST_PRACTICES=0" >> $GITHUB_OUTPUT
              echo "LIGHTHOUSE_SEO=0" >> $GITHUB_OUTPUT
              echo "LIGHTHOUSE_STATUS=server-failed" >> $GITHUB_OUTPUT
            fi

            # 서버 종료
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: 💬 PR 댓글 생성
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          # bundle-analysis
          BUNDLE_SIZE: ${{ steps.bundle-analysis.outputs.BUNDLE_SIZE }}
          TOTAL_JS_SIZE: ${{ steps.bundle-analysis.outputs.TOTAL_JS_SIZE }}
          JS_COUNT: ${{ steps.bundle-analysis.outputs.JS_COUNT }}
          MAIN_CHUNKS: ${{ steps.bundle-analysis.outputs.MAIN_CHUNKS }}
          # test-analysis
          TEST_ANALYSIS_MARKDOWN: ${{ steps.test-analysis.outputs.TEST_ANALYSIS_MARKDOWN }}
          TEST_SUCCESS_RATE: ${{ steps.test-analysis.outputs.TEST_SUCCESS_RATE }}
          COVERAGE_LINES: ${{ steps.test-analysis.outputs.COVERAGE_LINES }}
          # recommendations
          BUNDLE_RECOMMENDATIONS: ${{ steps.bundle-recommendations.outputs.BUNDLE_RECOMMENDATIONS }}
          # changed-pages
          CHANGED_PAGES: ${{ steps.changed-pages.outputs.CHANGED_PAGES }}
          IMPACT_LEVEL: ${{ steps.changed-pages.outputs.IMPACT_LEVEL }}
          TOTAL_CHANGED_PAGES: ${{ steps.changed-pages.outputs.TOTAL_PAGES }}
          # preview-url
          PREVIEW_URL: ${{ steps.preview-url.outputs.PREVIEW_URL }}
          USE_PREVIEW: ${{ steps.preview-url.outputs.USE_PREVIEW }}
          # lighthouse
          LIGHTHOUSE_PERFORMANCE: ${{ steps.lighthouse.outputs.LIGHTHOUSE_PERFORMANCE }}
          LIGHTHOUSE_ACCESSIBILITY: ${{ steps.lighthouse.outputs.LIGHTHOUSE_ACCESSIBILITY }}
          LIGHTHOUSE_BEST_PRACTICES: ${{ steps.lighthouse.outputs.LIGHTHOUSE_BEST_PRACTICES }}
          LIGHTHOUSE_SEO: ${{ steps.lighthouse.outputs.LIGHTHOUSE_SEO }}
          LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outputs.LIGHTHOUSE_STATUS }}
          LIGHTHOUSE_TOTAL_PAGES: ${{ steps.lighthouse.outputs.LIGHTHOUSE_TOTAL_PAGES }}
          LIGHTHOUSE_SUCCESSFUL_PAGES: ${{ steps.lighthouse.outputs.LIGHTHOUSE_SUCCESSFUL_PAGES }}
          LIGHTHOUSE_DETAILED_RESULTS: ${{ steps.lighthouse.outputs.LIGHTHOUSE_DETAILED_RESULTS }}
        with:
          script: |
            const get = (k, d='') => process.env[k] ?? d;

            // PR 번호 확인
            let prNumber;
            if (context.issue && context.issue.number) {
              prNumber = context.issue.number;
            } else if (context.payload.workflow_run && context.payload.workflow_run.pull_requests && context.payload.workflow_run.pull_requests[0]) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            } else {
              core.info('PR 번호를 찾을 수 없습니다.');
              return;
            }

            // 기존 봇 댓글 찾기
            const commentsResponse = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const comments = commentsResponse.data || [];
            const botComment = comments.find(c =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes('📊 PR 분석 리포트')
            );

            // env에서 안전하게 읽기 (멀티라인 포함)
            const bundleSize = get('BUNDLE_SIZE', '정보 없음');
            const totalJsSize = get('TOTAL_JS_SIZE', '정보 없음');
            const jsCount = get('JS_COUNT', '0');
            const mainChunks = get('MAIN_CHUNKS', '');

            const testMarkdown = get('TEST_ANALYSIS_MARKDOWN', '테스트 정보 없음');
            const testSuccessRate = get('TEST_SUCCESS_RATE', '0');
            const coverageLines = get('COVERAGE_LINES', '0');

            const bundleRecommendations = get('BUNDLE_RECOMMENDATIONS', '');

            // 변경사항 분석
            const changedPages = get('CHANGED_PAGES', '').split(',').filter(Boolean);
            const impactLevel = get('IMPACT_LEVEL', 'low');
            const totalChangedPages = get('TOTAL_CHANGED_PAGES', '0');

            // Preview URL 정보
            const previewUrl = get('PREVIEW_URL', '');
            const usePreview = get('USE_PREVIEW', 'false');

            // Lighthouse 결과
            const lighthousePerf = get('LIGHTHOUSE_PERFORMANCE', '0');
            const lighthouseA11y = get('LIGHTHOUSE_ACCESSIBILITY', '0');
            const lighthouseBP = get('LIGHTHOUSE_BEST_PRACTICES', '0');
            const lighthouseSEO = get('LIGHTHOUSE_SEO', '0');
            const lighthouseStatus = get('LIGHTHOUSE_STATUS', 'unavailable');
            const lighthouseTotalPages = get('LIGHTHOUSE_TOTAL_PAGES', '0');
            const lighthouseSuccessfulPages = get('LIGHTHOUSE_SUCCESSFUL_PAGES', '0');
            const lighthouseDetailedResults = get('LIGHTHOUSE_DETAILED_RESULTS', '');

            const runId = get('RUN_ID', String(context.runId));

            // 점수 계산 함수들
            function calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf) {
              const weights = { test: 0.25, coverage: 0.25, bundle: 0.25, lighthouse: 0.25 };
              const testScore = Math.min(parseFloat(testSuccessRate) || 0, 100) * weights.test;
              const coverageScore = Math.min(parseFloat(coverageLines) || 0, 100) * weights.coverage;

              let bundleScore = 25;
              if (bundleSize.includes('K')) {
                bundleScore = 25;
              } else if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 0.5) bundleScore = 25;
                else if (sizeMB < 1) bundleScore = 22;
                else if (sizeMB < 2) bundleScore = 18;
                else if (sizeMB < 3) bundleScore = 15;
                else if (sizeMB < 5) bundleScore = 10;
                else bundleScore = 5;
              }
              bundleScore *= weights.bundle;

              const lighthouseScore = (parseFloat(lighthousePerf) || 0) * weights.lighthouse;

              const totalScore = Math.round(testScore + coverageScore + bundleScore + lighthouseScore);
              let grade = 'D', emoji = '⚠️';
              if (totalScore >= 90) { grade = 'A+'; emoji = '🏆'; }
              else if (totalScore >= 80) { grade = 'A'; emoji = '🥇'; }
              else if (totalScore >= 70) { grade = 'B'; emoji = '🥈'; }
              else if (totalScore >= 60) { grade = 'C'; emoji = '🥉'; }

              return {
                score: totalScore,
                grade,
                emoji,
                breakdown: {
                  test: Math.round(testScore),
                  coverage: Math.round(coverageScore),
                  bundle: Math.round(bundleScore),
                  lighthouse: Math.round(lighthouseScore)
                }
              };
            }

            function getBundleSizeStatus(bundleSize) {
              if (bundleSize.includes('K')) return '🟢 매우 좋음';
              if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 1) return '🟢 좋음';
                if (sizeMB < 2) return '🟡 보통';
                if (sizeMB < 5) return '🟠 주의';
                return '🔴 개선 필요';
              }
              return '🔍 분석 중';
            }

            function getLighthouseStatus(score) {
              const num = parseFloat(score) || 0;
              if (num >= 90) return '🟢 우수';
              if (num >= 75) return '🟡 양호';
              if (num >= 50) return '🟠 보통';
              return '🔴 개선 필요';
            }

            const perf = calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf);

            const commentBody = `## 📊 PR 분석 리포트

            ### 🎯 번들 사이즈 분석

            **📦 프로덕션 빌드**: \`${bundleSize}\` (정적 파일) | \`${totalJsSize}\` (JavaScript) | ${jsCount}개 파일

            **상태**: ${getBundleSizeStatus(bundleSize)}

            <details>
            <summary>📁 주요 청크 파일들</summary>

            \`\`\`
            ${mainChunks || '청크 정보 없음'}
            \`\`\`

            **특징:**
            - ⚡ 코드 스플리팅으로 초기 로딩 최적화
            - 🔄 페이지별 번들 분리로 효율적 캐싱
            - 📱 사용자가 필요한 코드만 다운로드

            </details>

            ${testMarkdown}

            ${bundleRecommendations}

            ### 🔍 PR 변경사항 분석

            **영향도**: ${impactLevel === 'high' ? '🔴 높음' : impactLevel === 'medium' ? '🟡 보통' : '🟢 낮음'} | **변경된 페이지**: ${totalChangedPages}개

            ${changedPages.length > 0 ? `**측정 대상 페이지**: ${changedPages.join(', ')}` : '변경사항 없음'}

            ${usePreview === 'true' && previewUrl ? `**🌐 측정 환경**: [Vercel Preview](${previewUrl}) (실제 배포 환경)` : '**💻 측정 환경**: 로컬 빌드 서버'}

            ${lighthouseDetailedResults || `### ⚡ Lighthouse 성능 지표
            ${lighthouseStatus === 'simulated' ? '🔬 **시뮬레이션 점수**' : lighthouseStatus === 'server-failed' ? '❌ **측정 실패** (서버 시작 오류)' : usePreview === 'true' ? '🌐 **실제 배포 환경 측정**' : '💻 **로컬 환경 측정**'} ${lighthouseTotalPages > 0 ? `(${lighthouseSuccessfulPages}/${lighthouseTotalPages} 페이지 성공)` : ''}

            | 지표 | 평균 점수 | 상태 |
            |------|-----------|------|
            | 🚀 Performance | ${lighthousePerf}점 | ${getLighthouseStatus(lighthousePerf)} |
            | ♿ Accessibility | ${lighthouseA11y}점 | ${getLighthouseStatus(lighthouseA11y)} |
            | ✅ Best Practices | ${lighthouseBP}점 | ${getLighthouseStatus(lighthouseBP)} |
            | 🔍 SEO | ${lighthouseSEO}점 | ${getLighthouseStatus(lighthouseSEO)} |`}

            ### 🏆 전체 품질 점수

            ${perf.emoji} **${perf.score}/100** (${perf.grade})

            <details>
            <summary>📊 점수 구성 상세</summary>

            **가중치 기준 (각 25%):**
            - 🧪 테스트 성공률: ${testSuccessRate}% → **${perf.breakdown.test}점**
            - 🎯 코드 커버리지: ${coverageLines}% → **${perf.breakdown.coverage}점**
            - 📦 번들 최적화: ${getBundleSizeStatus(bundleSize)} → **${perf.breakdown.bundle}점**
            - ⚡ Lighthouse 성능: ${lighthousePerf}점 → **${perf.breakdown.lighthouse}점**

            </details>

            <details>
            <summary>📈 상세 분석 리포트</summary>

            - **번들 분석**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}
            - **테스트 커버리지**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}
            - **빌드 로그**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}

            </details>

            ---

            > 🤖 이 리포트는 PR이 업데이트될 때마다 자동으로 갱신됩니다.
            > 📅 마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

      - name: 📤 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports
          path: |
            apps/web/coverage/
            apps/web/.next/analyze/
          retention-days: 7
