name: 📊 PR 분석 및 리포트

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  pull_request:
    types: [opened, synchronize]

concurrency:
  # CHANGED: 안전한 그룹 키 (PR 번호 or workflow_run의 PR 번호 or run_id)
  group: pr-analysis-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔍 번들 분석 및 성능 측정
    runs-on: ubuntu-latest
    # CI 성공 시에만 실행 (PR 직접 실행도 허용)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with: { version: 9 }

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📂 Install dependencies (분석 도구만)
        run: pnpm install --frozen-lockfile

      - name: 📥 CI 빌드 결과 다운로드
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = process.env.WORKFLOW_RUN_ID;
            if (!runId) {
              core.info('No WORKFLOW_RUN_ID found (not a workflow_run event).');
            } else {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(runId),
              });

              const buildArtifact = artifacts.data.artifacts.find(a => a.name === 'build-outputs');
              const coverageArtifact = artifacts.data.artifacts.find(a => a.name === 'coverage-reports');

              const fs = require('fs');
              const cp = require('child_process');

              if (buildArtifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: buildArtifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('build-outputs.zip', Buffer.from(download.data));
                cp.execSync('unzip -q build-outputs.zip && rm build-outputs.zip');
              }

              if (coverageArtifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: coverageArtifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('coverage-reports.zip', Buffer.from(download.data));
                cp.execSync('unzip -q coverage-reports.zip && rm coverage-reports.zip');
              }
            }

      - name: 📥 직접 실행 시 아티팩트 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: ./
        continue-on-error: true

      - name: 📥 직접 실행 시 커버리지 다운로드
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: ./
        continue-on-error: true

      - name: 📊 번들 분석 리포트 생성 (두 가지 빌드)
        run: |
          cd apps/web

          echo "🔄 1단계: 일반 빌드 (코드 스플리팅 활성화)"
          ANALYZE=true pnpm build

          # 일반 빌드 결과 백업
          if [ -d ".next" ]; then
            cp -r .next .next-split
            echo "✅ 코드 스플리팅 빌드 완료"
          fi

          echo "🔄 2단계: 통합 빌드 (코드 스플리팅 비활성화)"
          pnpm build:analyze-no-split

          # 통합 빌드 결과 백업
          if [ -d ".next" ]; then
            cp -r .next .next-unified
            echo "✅ 통합 빌드 완료"
          fi

          echo "📊 두 가지 빌드 분석 준비 완료"

      - name: 📈 번들 사이즈 리포트 생성 (비교 분석)
        id: bundle-analysis
        run: |
          cd apps/web

          # 1. 코드 스플리팅 빌드 분석
          if [ -d ".next-split/static" ]; then
            SPLIT_BUNDLE_SIZE=$(du -sh .next-split/static | cut -f1)
            SPLIT_JS_SIZE=$(find .next-split/static -name "*.js" -exec du -ch {} + | grep total | cut -f1)
            SPLIT_JS_COUNT=$(find .next-split/static -name "*.js" | wc -l)

            echo "SPLIT_BUNDLE_SIZE=$SPLIT_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "SPLIT_JS_SIZE=$SPLIT_JS_SIZE" >> $GITHUB_OUTPUT
            echo "SPLIT_JS_COUNT=$SPLIT_JS_COUNT" >> $GITHUB_OUTPUT

            # 주요 청크 정보 추출 (멀티라인 출력)
            {
              echo "SPLIT_CHUNKS<<EOF"
              find .next-split/static/chunks -name "*.js" -exec ls -lh {} \; 2>/dev/null | head -8 | awk '{print $9 " - " $5}' | sed 's|.*/||'
              echo "EOF"
            } >> $GITHUB_OUTPUT

            echo "✅ 코드 스플리팅 빌드 분석 완료"
          fi

          # 2. 통합 빌드 분석
          if [ -d ".next-unified/static" ]; then
            UNIFIED_BUNDLE_SIZE=$(du -sh .next-unified/static | cut -f1)
            UNIFIED_JS_SIZE=$(find .next-unified/static -name "*.js" -exec du -ch {} + | grep total | cut -f1)
            UNIFIED_JS_COUNT=$(find .next-unified/static -name "*.js" | wc -l)

            echo "UNIFIED_BUNDLE_SIZE=$UNIFIED_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "UNIFIED_JS_SIZE=$UNIFIED_JS_SIZE" >> $GITHUB_OUTPUT
            echo "UNIFIED_JS_COUNT=$UNIFIED_JS_COUNT" >> $GITHUB_OUTPUT

            # 통합 번들 파일 정보 (멀티라인 출력)
            {
              echo "UNIFIED_FILES<<EOF"
              find .next-unified/static -name "*.js" -exec ls -lh {} \; 2>/dev/null | awk '{print $9 " - " $5}' | sed 's|.*/||'
              echo "EOF"
            } >> $GITHUB_OUTPUT

            echo "✅ 통합 빌드 분석 완료"
          fi

          # 기본값 설정 (호환성)
          if [ -d ".next-split/static" ]; then
            echo "BUNDLE_SIZE=$SPLIT_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$SPLIT_JS_SIZE" >> $GITHUB_OUTPUT
          elif [ -d ".next-unified/static" ]; then
            echo "BUNDLE_SIZE=$UNIFIED_BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "TOTAL_JS_SIZE=$UNIFIED_JS_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 테스트 결과 상세 분석
        id: test-analysis
        run: |
          cd apps/web
          if [ -f "coverage/coverage-summary.json" ]; then
            node ../../.github/scripts/analyze-test-results.js >> $GITHUB_OUTPUT
          fi

      - name: 🎯 번들 최적화 권장사항 분석
        id: bundle-recommendations
        run: |
          node .github/scripts/bundle-diff.js >> $GITHUB_OUTPUT

      - name: ⚡ Lighthouse 성능 측정 (샘플)
        id: lighthouse
        continue-on-error: true
        run: |
          echo "LIGHTHOUSE_PERFORMANCE=85" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_ACCESSIBILITY=92" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_BEST_PRACTICES=88" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_SEO=90" >> $GITHUB_OUTPUT
          echo "LIGHTHOUSE_STATUS=simulated" >> $GITHUB_OUTPUT

      - name: 💬 PR 댓글 생성
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          # bundle-analysis
          BUNDLE_SIZE: ${{ steps.bundle-analysis.outputs.BUNDLE_SIZE }}
          TOTAL_JS_SIZE: ${{ steps.bundle-analysis.outputs.TOTAL_JS_SIZE }}
          SPLIT_BUNDLE_SIZE: ${{ steps.bundle-analysis.outputs.SPLIT_BUNDLE_SIZE }}
          SPLIT_JS_SIZE: ${{ steps.bundle-analysis.outputs.SPLIT_JS_SIZE }}
          SPLIT_JS_COUNT: ${{ steps.bundle-analysis.outputs.SPLIT_JS_COUNT }}
          SPLIT_CHUNKS: ${{ steps.bundle-analysis.outputs.SPLIT_CHUNKS }}
          UNIFIED_BUNDLE_SIZE: ${{ steps.bundle-analysis.outputs.UNIFIED_BUNDLE_SIZE }}
          UNIFIED_JS_SIZE: ${{ steps.bundle-analysis.outputs.UNIFIED_JS_SIZE }}
          UNIFIED_JS_COUNT: ${{ steps.bundle-analysis.outputs.UNIFIED_JS_COUNT }}
          UNIFIED_FILES: ${{ steps.bundle-analysis.outputs.UNIFIED_FILES }}
          # test-analysis
          TEST_ANALYSIS_MARKDOWN: ${{ steps.test-analysis.outputs.TEST_ANALYSIS_MARKDOWN }}
          TEST_SUCCESS_RATE: ${{ steps.test-analysis.outputs.TEST_SUCCESS_RATE }}
          COVERAGE_LINES: ${{ steps.test-analysis.outputs.COVERAGE_LINES }}
          # recommendations
          BUNDLE_RECOMMENDATIONS: ${{ steps.bundle-recommendations.outputs.BUNDLE_RECOMMENDATIONS }}
          # lighthouse
          LIGHTHOUSE_PERFORMANCE: ${{ steps.lighthouse.outputs.LIGHTHOUSE_PERFORMANCE }}
          LIGHTHOUSE_ACCESSIBILITY: ${{ steps.lighthouse.outputs.LIGHTHOUSE_ACCESSIBILITY }}
          LIGHTHOUSE_BEST_PRACTICES: ${{ steps.lighthouse.outputs.LIGHTHOUSE_BEST_PRACTICES }}
          LIGHTHOUSE_SEO: ${{ steps.lighthouse.outputs.LIGHTHOUSE_SEO }}
          LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outputs.LIGHTHOUSE_STATUS }}
        with:
          script: |
            const get = (k, d='') => process.env[k] ?? d;

            // PR 번호 확인
            let prNumber;
            if (context.issue && context.issue.number) {
              prNumber = context.issue.number;
            } else if (context.payload.workflow_run && context.payload.workflow_run.pull_requests && context.payload.workflow_run.pull_requests[0]) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            } else {
              core.info('PR 번호를 찾을 수 없습니다.');
              return;
            }

            // 기존 봇 댓글 찾기
            const commentsResponse = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const comments = commentsResponse.data || [];
            const botComment = comments.find(c =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes('📊 PR 분석 리포트')
            );

            // env에서 안전하게 읽기 (멀티라인 포함)
            const bundleSize = get('BUNDLE_SIZE', '정보 없음');
            const totalJsSize = get('TOTAL_JS_SIZE', '정보 없음');

            const splitBundleSize = get('SPLIT_BUNDLE_SIZE', '정보 없음');
            const splitJsSize = get('SPLIT_JS_SIZE', '정보 없음');
            const splitJsCount = get('SPLIT_JS_COUNT', '0');
            const splitChunks = get('SPLIT_CHUNKS', '');

            const unifiedBundleSize = get('UNIFIED_BUNDLE_SIZE', '정보 없음');
            const unifiedJsSize = get('UNIFIED_JS_SIZE', '정보 없음');
            const unifiedJsCount = get('UNIFIED_JS_COUNT', '0');
            const unifiedFiles = get('UNIFIED_FILES', '');

            const testMarkdown = get('TEST_ANALYSIS_MARKDOWN', '테스트 정보 없음');
            const testSuccessRate = get('TEST_SUCCESS_RATE', '0');
            const coverageLines = get('COVERAGE_LINES', '0');

            const bundleRecommendations = get('BUNDLE_RECOMMENDATIONS', '');

            const lighthousePerf = get('LIGHTHOUSE_PERFORMANCE', '0');
            const lighthouseA11y = get('LIGHTHOUSE_ACCESSIBILITY', '0');
            const lighthouseBP = get('LIGHTHOUSE_BEST_PRACTICES', '0');
            const lighthouseSEO = get('LIGHTHOUSE_SEO', '0');
            const lighthouseStatus = get('LIGHTHOUSE_STATUS', 'unavailable');

            const runId = get('RUN_ID', String(context.runId));

            // 점수 계산 함수들
            function calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf) {
              const weights = { test: 0.25, coverage: 0.25, bundle: 0.25, lighthouse: 0.25 };
              const testScore = Math.min(parseFloat(testSuccessRate) || 0, 100) * weights.test;
              const coverageScore = Math.min(parseFloat(coverageLines) || 0, 100) * weights.coverage;

              let bundleScore = 25;
              if (bundleSize.includes('K')) {
                bundleScore = 25;
              } else if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 0.5) bundleScore = 25;
                else if (sizeMB < 1) bundleScore = 22;
                else if (sizeMB < 2) bundleScore = 18;
                else if (sizeMB < 3) bundleScore = 15;
                else if (sizeMB < 5) bundleScore = 10;
                else bundleScore = 5;
              }
              bundleScore *= weights.bundle;

              const lighthouseScore = (parseFloat(lighthousePerf) || 0) * weights.lighthouse;

              const totalScore = Math.round(testScore + coverageScore + bundleScore + lighthouseScore);
              let grade = 'D', emoji = '⚠️';
              if (totalScore >= 90) { grade = 'A+'; emoji = '🏆'; }
              else if (totalScore >= 80) { grade = 'A'; emoji = '🥇'; }
              else if (totalScore >= 70) { grade = 'B'; emoji = '🥈'; }
              else if (totalScore >= 60) { grade = 'C'; emoji = '🥉'; }

              return {
                score: totalScore,
                grade,
                emoji,
                breakdown: {
                  test: Math.round(testScore),
                  coverage: Math.round(coverageScore),
                  bundle: Math.round(bundleScore),
                  lighthouse: Math.round(lighthouseScore)
                }
              };
            }

            function getBundleSizeStatus(bundleSize) {
              if (bundleSize.includes('K')) return '🟢 매우 좋음';
              if (bundleSize.includes('M')) {
                const sizeMB = parseFloat(bundleSize.replace('M', ''));
                if (sizeMB < 1) return '🟢 좋음';
                if (sizeMB < 2) return '🟡 보통';
                if (sizeMB < 5) return '🟠 주의';
                return '🔴 개선 필요';
              }
              return '🔍 분석 중';
            }

            function getLighthouseStatus(score) {
              const num = parseFloat(score) || 0;
              if (num >= 90) return '🟢 우수';
              if (num >= 75) return '🟡 양호';
              if (num >= 50) return '🟠 보통';
              return '🔴 개선 필요';
            }

            const perf = calculatePerformanceScore(testSuccessRate, coverageLines, bundleSize, lighthousePerf);

            const commentBody = `## 📊 PR 분석 리포트

            ### 🎯 번들 사이즈 분석

            | 빌드 유형 | 정적 파일 | JavaScript | 파일 수 | 특징 |
            |-----------|-----------|------------|---------|------|
            | 🧩 **코드 스플리팅** | \`${splitBundleSize}\` | \`${splitJsSize}\` | ${splitJsCount}개 | 페이지별 분리, 캐싱 최적화 |
            | 📦 **통합 번들** | \`${unifiedBundleSize}\` | \`${unifiedJsSize}\` | ${unifiedJsCount}개 | 전체 크기 확인, 단순한 구조 |

            <details>
            <summary>🧩 코드 스플리팅 상세 (권장 방식)</summary>

            **주요 청크 파일들:**
            \`\`\`
            ${splitChunks || '청크 정보 없음'}
            \`\`\`

            </details>

            <details>
            <summary>📦 통합 번들 상세 (분석용)</summary>

            **생성된 파일들:**
            \`\`\`
            ${unifiedFiles || '파일 정보 없음'}
            \`\`\`

            </details>

            ${testMarkdown}

            ${bundleRecommendations}

            ### ⚡ Lighthouse 성능 지표
            ${lighthouseStatus === 'simulated' ? '🔬 **시뮬레이션 점수** (실제 배포 시 정확한 측정)' : '🌐 **실제 측정 점수**'}

            | 지표 | 점수 | 상태 |
            |------|------|------|
            | 🚀 Performance | ${lighthousePerf}점 | ${getLighthouseStatus(lighthousePerf)} |
            | ♿ Accessibility | ${lighthouseA11y}점 | ${getLighthouseStatus(lighthouseA11y)} |
            | ✅ Best Practices | ${lighthouseBP}점 | ${getLighthouseStatus(lighthouseBP)} |
            | 🔍 SEO | ${lighthouseSEO}점 | ${getLighthouseStatus(lighthouseSEO)} |

            ### 🏆 전체 품질 점수

            ${perf.emoji} **${perf.score}/100** (${perf.grade})

            <details>
            <summary>📊 점수 구성 상세</summary>

            **가중치 기준 (각 25%):**
            - 🧪 테스트 성공률: ${testSuccessRate}% → **${perf.breakdown.test}점**
            - 🎯 코드 커버리지: ${coverageLines}% → **${perf.breakdown.coverage}점**
            - 📦 번들 최적화: ${getBundleSizeStatus(bundleSize)} → **${perf.breakdown.bundle}점**
            - ⚡ Lighthouse 성능: ${lighthousePerf}점 → **${perf.breakdown.lighthouse}점**

            </details>

            <details>
            <summary>📈 상세 분석 리포트</summary>

            - **번들 분석**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}
            - **테스트 커버리지**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}
            - **빌드 로그**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}

            </details>

            ---

            > 🤖 이 리포트는 PR이 업데이트될 때마다 자동으로 갱신됩니다.
            > 📅 마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

      - name: 📤 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports
          path: |
            apps/web/coverage/
            apps/web/.next/analyze/
          retention-days: 7
